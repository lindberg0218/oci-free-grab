name: grab-free-vps

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: grab
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=ap-singapore-1
          EOF
          chmod 700 ~/.oci
          chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config

      - name: Try to launch (loop ~8 min)
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
          DEADLINE_SECS: "480"
          TRY_E2: ${{ vars.TRY_E2 || '0' }}
        run: bash launch_free.sh

      - name: Notify on success
        if: ${{ hashFiles('.grabbed') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ 免费 A1 实例已建成" \
            --body "GitHub Actions 抢到免费机了。控制台查看公网IP: https://cloud.oracle.com/compute/instances?region=ap-singapore-1 ｜ 抢到后请停用本 workflow: Settings -> Actions -> grab-free-vps -> Disable"

      - name: Chain next run
        if: ${{ hashFiles('.grabbed') == '' && vars.STOP != '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          n=$(oci compute instance list --compartment-id "$OCI_TENANCY_OCID" --query 'length(data)' --raw-output 2>/dev/null || echo 0)
          echo "现有实例数: $n"
          if [ "$n" != "0" ]; then echo "已有实例, 不再链式触发"; exit 0; fi
          sleep 540
          gh workflow run grab.yml --ref "${GITHUB_REF_NAME:-master}"
          echo "已触发下一轮"
